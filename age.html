<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Child Age</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-box">

<h2>Select Child's Age</h2>

<select id="age">

<option value="">Choose Age</option>

<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>

</select>

<br><br>

<button onclick="nextPage()">

Continue

</button>

</div>

<script>

function nextPage(){

const age =
document.getElementById("age").value;

if(age===""){
alert("Please select the child's age.");
return;
}

localStorage.setItem("age", age);

window.location.href="parent.html";

}

</script>

</body>
    </html>
