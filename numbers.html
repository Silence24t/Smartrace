<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numbers</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="lesson-box">

<h2>Number Practice</h2>

<h1 id="number">1</h1>

<canvas id="traceBoard"></canvas>

<div class="buttons">

<button onclick="previousNumber()">Previous</button>

<button onclick="clearBoard()">Clear</button>

<button onclick="nextNumber()">Next</button>

</div>

</div>

<script>

let currentNumber = 1;

function updateNumber(){
document.getElementById("number").innerHTML=currentNumber;
}

function nextNumber(){

if(currentNumber<10){
currentNumber++;
updateNumber();
}

}

function previousNumber(){

if(currentNumber>1){
currentNumber--;
updateNumber();
}

}

function clearBoard(){

alert("Tracing board cleared.");

}

</script>

</body>
</html>
